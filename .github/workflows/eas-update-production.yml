name: EAS Update - Production and Preview

on:
  push:
    branches:
      - main

concurrency:
  group: eas-update-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish production and preview updates
    runs-on: ubuntu-latest
    steps:
      - name: Check for Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing EAS updates."
            echo "Create one at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect native changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          echo "$changed_files"

          if echo "$changed_files" | grep -Eq '^(app\.json|app\.config\.[^/]+|eas\.json|package\.json|package-lock\.json|ios/|android/|plugins/)'; then
            echo "publish_update=false" >> "$GITHUB_OUTPUT"
            echo "A native-affecting file changed. Create new EAS builds instead of publishing this commit over the air."
          else
            echo "publish_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.publish_update == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.publish_update == 'true'
        run: npm ci

      - name: Setup EAS
        if: steps.changes.outputs.publish_update == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish production EAS Update
        if: steps.changes.outputs.publish_update == 'true'
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: >-
          eas update
          --channel production
          --environment production
          --platform all
          --message "$UPDATE_MESSAGE"
          --non-interactive

      - name: Publish preview EAS Update
        if: steps.changes.outputs.publish_update == 'true'
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: >-
          eas update
          --channel preview
          --environment preview
          --platform all
          --message "$UPDATE_MESSAGE"
          --non-interactive
